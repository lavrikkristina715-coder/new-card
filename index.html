<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abramova Brow | Бьюти-мастер Ася</title>
    <style>
        :root {
            /* Нежная пастельная палитра */
            --bg-start: #fbf5f3; /* Цвет взбитых сливок */
            --bg-end: #ebdcd7;   /* Цвет пыльной розы */
            --card-bg: rgba(255, 255, 255, 0.75); /* Полупрозрачный глянец */
            --accent-color: #bfa399; /* Благородный кофейно-пастельный */
            --text-main: #3a3230;
            --text-muted: #7d706c;
            --border-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-list-style: none;
        }

        body {
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Задний фон: Анимация дыма и золотых частиц */
        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Слои дыма */
        .smoke {
            position: absolute;
            bottom: -50px;
            left: 50%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
            transform: translateX(-50%);
            opacity: 0;
            filter: blur(40px);
            animation: riseSmoke 9s infinite linear;
        }
        .smoke2 {
            animation-delay: 3s;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(240,220,215,0.7) 0%, rgba(240,220,215,0) 70%);
        }
        .smoke3 {
            animation-delay: 6s;
            width: 700px;
        }

        /* Магические кружащиеся частицы */
        .particle {
            position: absolute;
            bottom: -10px;
            background: radial-gradient(circle, #f3e1d3 0%, rgba(255,215,0,0) 80%);
            border-radius: 50%;
            opacity: 0.6;
            animation: riseParticles 7s infinite linear;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            backdrop-filter: blur(20px); /* Эффект матового стекла */
            box-shadow: 0 15px 35px rgba(163, 140, 133, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            padding: 35px 25px;
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .logo-text {
            font-size: 19px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: var(--text-main);
            font-weight: 300;
            border-bottom: 1px solid rgba(181, 159, 152, 0.2);
            padding-bottom: 15px;
        }

        /* Мягкое покачивание фото */
        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
            animation: float 4s ease-in-out infinite;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 25px rgba(181, 159, 152, 0.3);
        }

        .name {
            font-size: 25px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .sub-title {
            font-size: 12px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 35px;
            font-weight: 600;
        }

        .services-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-align: left;
            padding-left: 5px;
        }

        .services-list {
            list-style: none !important;
            padding: 0;
            margin: 0 0 35px 0;
        }

        .services-list li {
            list-style: none !important;
            background: rgba(255, 255, 255, 0.6);
            padding: 15px 18px;
            border-radius: 14px;
            margin-bottom: 10px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 3px solid var(--accent-color);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            text-align: left;
            color: #4a403d;
        }

        .services-list li:hover {
            transform: translateX(6px);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 5px 15px rgba(181, 159, 152, 0.1);
        }

        .services-list li span {
            margin-right: 12px;
            color: var(--accent-color);
            font-size: 15px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
        }

        .btn-tg {
            background-color: #54a9d6;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(84, 169, 214, 0.2);
        }
        .btn-tg:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(84, 169, 214, 0.35);
        }

        .btn-wa {
            background-color: #5cc884;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(92, 200, 132, 0.2);
        }
        .btn-wa:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(92, 200, 132, 0.35);
        }

        .btn-phone {
            background-color: transparent;
            color: #7d706c;
            border: 1.5px solid #b59f98;
            box-shadow: 0 4px 10px rgba(181, 159, 152, 0.05);
        }
        .btn-phone:hover {
            background-color: #b59f98;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(181, 159, 152, 0.3);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            fill: currentColor;
        }

        /* Новые анимации эффектов */
        @keyframes riseSmoke {
            0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
            15% { opacity: 0.4; }
            50% { opacity: 0.2; }
            100% { transform: translate(-50%, -600px) scale(1.5); opacity: 0; }
        }

        @keyframes riseParticles {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-100vh) translateX(50px) scale(1.2); opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <!-- Эффекты заднего фона -->
    <div class="background-effects">
        <div class="smoke"></div>
        <div class="smoke smoke2"></div>
        <div class="smoke smoke3"></div>
        <!-- Крупицы -->
        <div class="particle" style="left: 10%; width: 6px; height: 6px; animation-duration: 6s;"></div>
        <div class="particle" style="left: 30%; width: 4px; height: 4px; animation-duration: 8s; animation-delay: 2s;"></div>
        <div class="particle" style="left: 55%; width: 8px; height: 8px; animation-duration: 7s; animation-delay: 1s;"></div>
        <div class="particle" style="left: 80%; width: 5px; height: 5px; animation-duration: 9s; animation-delay: 3s;"></div>
    </div>

    <div class="container">
        <div class="logo-text">ABRAMOVA BROW</div>

        <div class="avatar-container">
            <img src="avatar.jpg" alt="Ася" class="avatar">
        </div>

        <div class="name">Ася</div>
        <div class="sub-title">Бьюти Мастер</div>

        <div class="services-title">Услуги:</div>
        <ul class="services-list">
            <li><span>✦</span> 1. Коррекция и окрашивание бровей</li>
            <li><span>✦</span> 2. Ламинирование ресниц и бровей</li>
            <li><span>✦</span> 3. Шугаринг тела и лица</li>
            <li><span>✦</span> 4. Плетение кос / Канекалон</li>
            <li><span>✦</span> 5. Макияж дневной / Вечерний</li>
            <li><span>✦</span> 6. Сам себе визажист / Обучение</li>
        </ul>

        <div class="buttons-container">
            <a href="https://t.me" target="_blank" class="btn btn-tg">
