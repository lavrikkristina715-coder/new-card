<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asya | Beauty Master</title>
    <style>
        :root {
            --text-main: #2c2523;
            --text-muted: #6b5e5a;
            --gold-light: #fff5d6;
            --gold-main: #dfba6b;
            --gold-dark: #8a6f3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif, sans-serif;
        }

        body {
            background-color: #0b0f09;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
            /* Живой переливающийся премиум-фон */
            background: linear-gradient(135deg, #070d05 0%, #142010 50%, #050804 100%);
            background-size: 400% 400%;
            animation: gradientBg 12s ease infinite;
        }

        /* Золотые мерцающие частицы на фоне */
        .sparks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .spark {
            position: absolute;
            bottom: -20px;
            background: radial-gradient(circle, var(--gold-light) 0%, rgba(223,186,107,0) 70%);
            border-radius: 50%;
            opacity: 0.6;
            animation: riseUp 8s infinite linear;
        }

        /* Карточка с эффектом переливающегося золотого свечения */
        .card-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            padding: 3px; 
            border-radius: 30px;
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark), var(--gold-light), var(--gold-main));
            background-size: 300% 300%;
            animation: borderMove 4s linear infinite, cardGlow 3s ease-in-out infinite alternate;
        }

        .container {
            width: 100%;
            background: linear-gradient(180deg, #fefcf7 0%, #f7f1e6 100%);
            border-radius: 27px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(223, 186, 107, 0.1);
        }

        /* Фото в золотом ореоле */
        .avatar-container {
            width: 125px;
            height: 125px;
            margin: 0 auto 15px;
            position: relative;
            padding: 3px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(138, 111, 62, 0.25);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .name {
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 2px;
            letter-spacing: 1px;
            color: #1a1514;
        }

        .sub-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .heart-divider {
            color: var(--gold-dark);
            font-size: 10px;
            margin-bottom: 25px;
            opacity: 0.7;
        }

        .services-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-align: left;
            padding-left: 5px;
            font-weight: bold;
        }

        .services-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
        }

        .services-list li {
            background: rgba(255, 255, 255, 0.85);
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 10px;
            font-size: 14px;
            border: 1px solid rgba(223, 186, 107, 0.2);
            display: flex;
            align-items: center;
            text-align: left;
            color: var(--text-main);
            transition: transform 0.3s ease;
        }

        .services-list li:hover {
            transform: translateX(4px);
            border-color: var(--gold-main);
        }

        .services-list li span {
            margin-right: 10px;
            color: var(--gold-dark);
            font-size: 11px;
        }

        /* Кнопки связи */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .btn-tg {
            background-color: #f3eae1;
            color: #3f5249;
            border: 1px solid rgba(138, 111, 62, 0.25);
        }
        .btn-tg:hover { background-color: #ebdccf; transform: translateY(-1px); }

        .btn-wa {
            background-color: #e6edd9;
            color: #364a3d;
            border: 1px solid rgba(138, 111, 62, 0.25);
        }
        .btn-wa:hover { background-color: #d7e4c5; transform: translateY(-1px); }

        .btn-phone {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--gold-dark);
        }
        .btn-phone:hover {
            background-color: var(--gold-dark);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            fill: currentColor;
        }

        /* --- Анимации --- */
        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes borderMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 15px rgba(223,186,107,0.2); }
            100% { box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 35px rgba(255,245,214,0.5); }
        }

        @keyframes riseUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-100vh) translateX(20px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
