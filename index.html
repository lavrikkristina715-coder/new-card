<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abramova Brow | Бьюти-мастер Ася</title>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #141416;
            --accent-color: #e0b0ff; /* Сиреневый неон */
            --accent-glow: rgba(224, 176, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #a1a1a5;
            --border-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 10%, #20132b 0%, #0b0b0c 70%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(224, 176, 255, 0.05);
            border: 1px solid #242427;
            padding: 35px 25px;
            text-align: center;
            position: relative;
        }

        /* Эффект мерцания логотипа */
        .logo-text {
            font-size: 20px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: var(--text-main);
            font-weight: 300;
            border-bottom: 1px solid #242427;
            padding-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Движение (пульсация) аватара */
        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            animation: float 4s ease-in-out infinite;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .sub-title {
            font-size: 13px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .services-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-align: left;
            padding-left: 5px;
        }

        .services-list {
            list-style: none;
            text-align: left;
            margin-bottom: 35px;
        }

        /* Плавное движение пунктов при наведении */
        .services-list li {
            background: #1a1a1e;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 14px;
            border: 1px solid #242427;
            border-left: 3px solid var(--accent-color);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .services-list li:hover {
            transform: translateX(6px);
            background: #202025;
            box-shadow: 0 0 12px rgba(224, 176, 255, 0.1);
        }

        .services-list li span {
            margin-right: 12px;
            color: var(--accent-color);
            text-shadow: 0 0 5px var(--accent-glow);
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Общие стили кнопок и их свечение */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        /* Анимация пульсации для кнопок связи */
        .btn-tg {
            background-color: #229ED9;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.2);
        }
        .btn-tg:hover {
            background-color: #28a7e3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 158, 217, 0.4);
        }

        .btn-wa {
            background-color: #25D366;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
        }
        .btn-wa:hover {
            background-color: #2bd96f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* Неоновая кнопка звонка */
        .btn-phone {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 10px rgba(224, 176, 255, 0.1);
        }
        .btn-phone:hover {
            background-color: var(--accent-color);
            color: #121212;
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--accent-color);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            fill: currentColor;
        }

        /* Анимации движения */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-text">ABRAMOVA BROW</div>

        <div class="avatar-container">
            <img src="avatar.jpg" alt="Ася" class="avatar">
        </div>

        <div class="name">Ася</div>
        <div class="sub-title">Бьюти Мастер</div>

        <div class="services-title">Услуги:</div>
        <ul class="services-list">
            <li><span>✦</span> 1. Коррекция и окрашивание бровей</li>
            <li><span>✦</span> 2. Ламинирование ресниц и бровей</li>
            <li><span>✦</span> 3. Шугаринг тела и лица</li>
            <li><span>✦</span> 4. Плетение кос / Канекалон</li>
            <li><span>✦</span> 5. Макияж дневной / Вечерний</li>
            <li><span>✦</span> 6. Сам себе визажист / Обучение</li>
        </ul>

            <!-- Кнопка Позвонить -->
            <a href="tel:+79015710088" class="btn btn-phone">
                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                Позвонить
            </a>
        </div>
    </div>

</body>
</html>
